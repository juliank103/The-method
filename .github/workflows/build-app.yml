name: Build the app

# Builds the double-click Mac and Windows apps, checks each one starts, and
# publishes them on the repo's Releases page ("Tweetus Deletus").
#
# To build your X app's Client ID into the apps, add a repository variable
# named X_CLIENT_ID (Settings → Secrets and variables → Actions → Variables),
# then re-run this workflow.

on:
  push:
    branches: [main, master, claude/pensive-goodall-9btu4p]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_smoke.py
      - run: python -m unittest tests.test_webui

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            file: Tweetus-Deletus-Mac.zip
          - os: windows-latest
            file: Tweetus-Deletus-Windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r requirements.txt pyinstaller==6.11.1 pillow

      - name: Build in the X app's Client ID
        if: ${{ vars.X_CLIENT_ID != '' }}
        env:
          X_CLIENT_ID: ${{ vars.X_CLIENT_ID }}
        run: |
          python -c "import json, os; json.dump({'client_id': os.environ['X_CLIENT_ID'].strip()}, open('tweetus_deletus/bundled.json', 'w'))"

      - name: Build
        run: pyinstaller --noconfirm packaging/tweetus.spec

      - name: Check the Mac app starts, then zip it
        if: runner.os == 'macOS'
        run: |
          "dist/Tweetus Deletus.app/Contents/MacOS/Tweetus Deletus" --demo ui --no-browser --port 8790 &
          APP=$!
          for i in $(seq 1 60); do curl -fsS -o page.html http://127.0.0.1:8790/ && break; sleep 1; done
          grep -q tweetus-token page.html
          curl -fsS -o /dev/null http://127.0.0.1:8790/static/app.js
          kill $APP
          ditto -c -k --keepParent "dist/Tweetus Deletus.app" "${{ matrix.file }}"

      - name: Check the Windows app starts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist\Tweetus Deletus.exe" -ArgumentList "--demo","ui","--no-browser","--port","8790" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            try {
              $page = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8790/
              $js = Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 http://127.0.0.1:8790/static/app.js
              $ok = ($page.Content -match 'tweetus-token') -and ($js.StatusCode -eq 200)
            } catch { Start-Sleep -Seconds 1 }
          }
          taskkill /F /T /PID $app.Id | Out-Null
          if (-not $ok) { throw "The app didn't start" }
          Copy-Item "dist\Tweetus Deletus.exe" "${{ matrix.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          **Mac:** download `Tweetus-Deletus-Mac.zip`, open it, then open **Tweetus Deletus**.
          The first time, macOS may refuse. Go to **System Settings → Privacy & Security**,
          scroll down, click **Open Anyway**, and confirm.

          **Windows:** download `Tweetus-Deletus-Windows.exe` and open it. If you see
          “Windows protected your PC”, click **More info → Run anyway**.

          It opens in your browser. Click **Connect with X**, pick what should
          disappear, check the list, and delete. Use **Quit** (top right) to close it.
          EOF
          gh release delete tweetus-deletus --yes --cleanup-tag || true
          gh release create tweetus-deletus out/* --target "$GITHUB_SHA" \
            --title "Tweetus Deletus" --notes-file notes.md --latest
