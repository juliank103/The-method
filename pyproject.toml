[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetus-deletus"
version = "1.0.0"
description = "Personal tool to mass-delete your own X/Twitter content via the official API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]

[project.scripts]
tweetus-deletus = "tweetus_deletus.cli:main"

[tool.setuptools]
packages = ["tweetus_deletus"]

[tool.setuptools.package-data]
tweetus_deletus = ["ui/*"]
